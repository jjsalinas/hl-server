// Half-Life Server Configuration
// Crossfire Only Server

// Server name (will be overwritten by environment variable)
hostname "Half-Life Crossfire Server"

// RCON password (will be overwritten by environment variable)
rcon_password "changeme"

// Server password (will be overwritten by environment variable)
sv_password ""

// Max players (will be overwritten by environment variable)
maxplayers 16

// Round settings - 15 minutes (900 seconds)
mp_timelimit 15
mp_roundtime 15

// Gameplay settings
mp_friendlyfire 0
mp_footsteps 1
mp_flashlight 1
mp_autocrosshair 1
mp_autoteambalance 1
mp_limitteams 2

// Server settings
sv_maxrate 25000
sv_minrate 5000
sv_maxupdaterate 101
sv_minupdaterate 10
sv_maxcmdrate 101
sv_mincmdrate 10

// Voice communication
sv_voiceenable 1
sv_voicecodec voice_speex
sv_voicequality 5

// Download settings
sv_allowdownload 1
sv_allowupload 1
sv_sendvelocity 1

// Server logging
log on
sv_logbans 1
sv_logecho 1
sv_logfile 1
sv_log_onefile 0

// Execute on map start
exec roundstart.cfg
